<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>video-ai-workflow · 通用画布</title>
<style>
@font-face{
  font-family:'KaziSerif';
  src:url('./fonts/NotoSerifSC-SemiBold.woff2') format('woff2');
  font-weight:600;font-style:normal;font-display:block;
}
@font-face{
  font-family:'KaziSans';
  src:url('./fonts/NotoSansSC-Regular.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:block;
}
@font-face{
  font-family:'KaziSans';
  src:url('./fonts/NotoSansSC-Medium.woff2') format('woff2');
  font-weight:500;font-style:normal;font-display:block;
}
</style>
<style>
html,body{margin:0;padding:0;overflow:hidden;
  font-family:'KaziSans',sans-serif}
#stage{position:relative;overflow:hidden;background:#F2EFE6;transition:none}
#stage.dark{background:#1F3B4D}
#stage.red{background:#A8231A}

#grain{position:absolute;inset:0;width:100%;height:100%;opacity:.05;
  mix-blend-mode:multiply;pointer-events:none;z-index:2}
#vign{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(26,28,31,.07) 100%)}
#themeWash{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  will-change:transform,opacity}
/* 转场墨线：1px，领先于新页推进 */
#wipeLine{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
#wipeLine .bar{position:absolute;top:0;bottom:0;width:1px;background:currentColor;opacity:.55}

#chap{position:absolute;z-index:6}
#chap .num{font-weight:700;color:currentColor;letter-spacing:-.02em;line-height:1;opacity:.55}
#chap .cn{font-weight:600;letter-spacing:.08em;line-height:1.3}
#chap .en{font-weight:500;letter-spacing:.22em;line-height:1.3;opacity:.6}
#stage.dark #chap .cn,#stage.red #chap .cn{color:#F2EFE6}
#stage.dark #chap .num,#stage.red #chap .num{color:currentColor}

#tc{position:absolute;z-index:6;text-align:right}
#tc .lbl{font-weight:500;letter-spacing:.24em;opacity:.55}
#tcVal{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#stage.dark #tcVal,#stage.red #tcVal{color:rgba(242,239,230,.9)}

/* 页眉栏线：横贯内容区，1px，低对比 */
#hr{position:absolute;z-index:5;height:1px;background:currentColor;opacity:.18}
/* 页脚栏线 */
#fr{position:absolute;z-index:5;height:1px;background:currentColor;opacity:.18}

#scenes{position:absolute;inset:0;z-index:4}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity}

#folio{position:absolute;z-index:6;font-weight:500;letter-spacing:.10em;
  opacity:.42;font-variant-numeric:tabular-nums}
#folioT{opacity:.6}

#prog{position:absolute;z-index:6;background:rgba(140,133,120,.22)}
#prog .fill{height:100%;background:currentColor;opacity:.28;width:0}
#stage.dark #prog,#stage.red #prog{background:rgba(242,239,230,.2)}
#stage.red #prog .fill{background:currentColor}

#cap{position:absolute;left:0;right:0;z-index:7;display:flex;justify-content:center}
#caprow{color:#1A1C1F;text-align:center;letter-spacing:.01em}
#caprow .ch{display:inline-block}
#caprow .ch.kw{color:#C4471F}
#stage.dark #caprow{color:#F2EFE6}
#stage.dark #caprow .ch.kw,#stage.red #caprow .ch.kw{color:#C99B3F}
#stage.red #caprow{color:#F2EFE6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="grain" width="270" height="480"></canvas>
  <div id="vign"></div>
  <div id="themeWash"></div>
  <div id="wipeLine"><div class="bar" id="wipeBar"></div></div>
  <div id="hr"></div>
  <div id="chap"><div class="num" id="chapNum">01</div>
    <div class="cn" id="chapCn"></div><div class="en" id="chapEn"></div></div>
  <div id="tc"><div class="lbl" id="tcLbl">TC</div><div id="tcVal">00:00</div></div>
  <div id="scenes"></div>
  <div id="fr"></div>
  <div id="folio"><span id="folioN">01</span><span id="folioT">/ 10</span></div>
  <div id="prog"><div class="fill" id="progFill"></div></div>
  <div id="cap"><div class="row" id="caprow"></div></div>
</div>

<script src="anim.js"></script>
<script src="time.js"></script>
<script src="layout.js"></script>
<script src="scenes.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// 通用画布 —— 竖屏 / 横屏 / 4:3 / 1:1 自适应
// 用法：canvas.html?ratio=16:9
// ═══════════════════════════════════════════════════════════

const A = window.Anim;
const CL = A.clamp, LP = A.lerp, IV = A.inv, E = A.E;
const el = id => document.getElementById(id);

let L = null;      // Layout
let KIT = null;    // timeline
let SCENES = [];   // 场景元数据
let DEF = [];      // 场景定义

// ─── 纸纹 ───
(function grain(){
  const c = el('grain'), g = c.getContext('2d');
  const img = g.createImageData(270, 480);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (Math.random() - .5) * 90;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
})();

// ─── 每个场景该显示哪一句的字幕 ——
// 用 scene 覆盖的句子范围，不依赖 cap 的切分
function captionFor(t, scene) {
  for (const l of KIT.lines) {
    if (t >= l.start - 0.10 && t < l.end + 0.50 &&
        l.tag >= scene.first && l.tag <= scene.last) return l;
  }
  // 兜底：整片找
  for (const l of KIT.lines) {
    if (t >= l.start - 0.10 && t < l.end + 0.50) return l;
  }
  return null;
}

// ─── 字幕：按标点切（工作流 5.14）──
const BREAK = '，。？！；：、,.?!;:';
const MAXC = 16;

function capChunks(cap) {
  const phrases = [];
  let cur = [];
  for (const c of cap) {
    cur.push(c);
    if (BREAK.includes(c.c)) { phrases.push(cur); cur = []; }
  }
  if (cur.length) phrases.push(cur);

  const w = arr => arr.filter(c => !BREAK.includes(c.c)).length;
  const chunks = [];
  let acc = [];
  const flush = () => {
    const real = acc.filter(c => !BREAK.includes(c.c));
    if (real.length) chunks.push(real);
    acc = [];
  };
  for (const p of phrases) {
    if (w(acc) + w(p) <= MAXC) { acc = acc.concat(p); continue; }
    flush();
    if (w(p) <= MAXC) acc = p;
    else {
      let cur2 = [];
      for (const c of p) {
        if (w(cur2) >= MAXC && !BREAK.includes(c.c)) {
          acc = cur2; flush(); cur2 = [];
        }
        cur2.push(c);
      }
      if (cur2.length) { acc = cur2; flush(); }
    }
  }
  flush();

  const merged = [];
  for (const c of chunks) {
    if (merged.length && c.length <= 4) {
      const prev = merged[merged.length - 1];
      if (prev.length + c.length <= MAXC + 2) {
        merged[merged.length - 1] = prev.concat(c);
        continue;
      }
    }
    merged.push(c);
  }
  return merged;
}

function currentChunk(t, line) {
  if (!line || !line.cap) return null;
  const chunks = capChunks(line.cap);
  if (!chunks.length) return null;
  let idx = 0;
  for (let i = 0; i < chunks.length; i++) {
    if (t >= chunks[i][0].s - 0.10) idx = i;
    else break;
  }
  return chunks[idx];
}

function renderCaption(t, scene) {
  const row = el('caprow');
  const line = captionFor(t, scene);
  if (!line) { row.innerHTML = ''; row.style.opacity = 0; return; }
  const chunk = currentChunk(t, line);
  if (!chunk) { row.innerHTML = ''; row.style.opacity = 0; return; }

  // 字幕位置和字号（按 Layout）
  row.style.font = `600 ${L.font('cap')}px/1.42 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif`;
  row.style.maxWidth = Math.round(L.W * 0.88) + 'px';
  el('cap').style.bottom = L.pad('capBot') + 'px';

  row.style.opacity = E.smooth(IV(chunk[0].s - 0.10, chunk[0].s, t));
  row.innerHTML = chunk.map(c => {
    const k = CL((t - c.s + 0.03) / 0.10);
    const op = LP(0.30, 1, k);
    const cls = c.k ? 'ch kw' : 'ch';
    return `<span class="${cls}" style="opacity:${op.toFixed(3)}">${c.c}</span>`;
  }).join('');
}

// ─── 建场景 ───
function buildScenes() {
  const box = el('scenes');
  box.innerHTML = '';
  SCENES = [];

  const FADE = 0.30;

  DEF.forEach((d, i) => {
    // 该场景覆盖的句子
    const lines = KIT.lines.filter(l => l.tag >= d.first && l.tag <= d.last);
    if (!lines.length) return;
    const from = lines[0].start;
    const to = lines[lines.length - 1].end;

    // 关键词时刻
    let kwT = null, kwWord = '';
    for (const k of (KIT.keywords || [])) {
      if (k.t >= from - 0.01 && k.t <= to + 0.01) { kwT = k.t; kwWord = k.word; break; }
    }
    if (kwT == null) kwT = (from + to) / 2;

    // ⚠️ 两条硬约束（工作流 0.00 闸门 1）
    let inFrom = Math.min(kwT - 2.0, from - 0.15);
    if (i > 0) {
      const prevOut = SCENES[i-1].to + 0.22;
      inFrom = Math.max(inFrom, prevOut - 0.45);
    }
    const latestIn = kwT - 1.35 - FADE;
    if (inFrom > latestIn) inFrom = latestIn;

    const meta = {
      i, sid: d.sid || String(i+1).padStart(2,'0'),
      kind: d.kind, theme: d.theme || 'paper',
      first: d.first, last: d.last,
      from, to, kwT, kwWord, kwHit: kwT - 3/60,
      inFrom, outTo: to + 0.22,
      data: d.data || {},
      chap: d.chap || null,
    };

    const built = Scenes.build({
      kind: d.kind, theme: meta.theme, data: meta.data,
      L, hit: meta.kwHit, t0: inFrom, t1: meta.outTo,
    });
    box.appendChild(built.el);
    meta.el = built.el;
    meta.update = built.update;
    SCENES.push(meta);
  });

  // outTo 不能被下一场压掉
  for (let i = 0; i < SCENES.length - 1; i++) {
    SCENES[i].outTo = Math.min(SCENES[i].outTo, SCENES[i+1].inFrom + 0.6);
  }
  window.__S__ = SCENES;
}

// ─── 每帧 ───
window.renderFrame = function (t) {
  if (!KIT || !SCENES.length) return;

  const FADE = 0.30;
  let si = 0;
  for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i].inFrom) si = i;

  // 淡入淡出
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    const op = Math.min(IV(s.inFrom, s.inFrom + FADE, t),
                        1 - IV(s.outTo - FADE, s.outTo, t));
    s.el.style.opacity = op;
    s.el.classList.toggle('on', op > 0.001);
  }

  // 主题色
  const cur = SCENES[si], prev = si > 0 ? SCENES[si-1] : cur;
  const st = el('stage');
  const DARK = x => x === 'dark' || x === 'deep';
  const wash = el('themeWash');
  const same = (cur.theme === prev.theme) || (DARK(cur.theme) && DARK(prev.theme));
  if (same) {
    wash.style.opacity = 0;
    st.classList.toggle('dark', DARK(cur.theme));
    st.classList.toggle('red', cur.theme === 'red');
  } else {
    // ═══════════════════════════════════════════════════════
    // 主题切换转场：两种，只留这两种
    //   ① 纸质 wipe —— 1px 墨线领先，新页从右侧推入
    //   ② 整页上移 —— 旧页上移 8%，新页从下方 8% 进入
    //
    // 已删除：radial-gradient 径向扩散（观感接近 PPT 自带转场）
    // 禁止：叠化、缩放推拉、任何超过 0.35s 的转场
    // ═══════════════════════════════════════════════════════
    const DUR = 0.28;                    // 固定 0.28s，不长于 0.35s
    const t0 = cur.inFrom;
    const k = CL(IV(t0, t0 + DUR, t));   // 0 → 1
    const col = cur.theme === 'red' ? '#A8231A' : DARK(cur.theme) ? '#1F3B4D' : '#F2EFE6';

    // 两种转场交替使用：字数多的段用上移，字数少的用 wipe
    const useWipe = (cur.sid.charCodeAt(0) % 2) === 0;
    const line = el('wipeLine'), bar = el('wipeBar');

    if (k < 1) {
      // 转场中：旧主题保持，新颜色层推进
      st.classList.toggle('dark', DARK(prev.theme));
      st.classList.toggle('red', prev.theme === 'red');
      wash.style.opacity = 1;
      wash.style.background = col;

      if (useWipe) {
        // 纸质 wipe：色层从右侧推入，左边缘是一条 1px 墨线
        const e = E.standard ? E.standard(k) : k;
        wash.style.transform = `translateX(${(1 - e) * 100}%)`;
        line.style.display = 'block';
        bar.style.left = `${(1 - e) * 100}%`;
        bar.style.background = DARK(cur.theme) ? '#F2EFE6' : '#1A1C1F';
      } else {
        // 整页上移：色层从下方 8% 升起
        const e = k * k * (3 - 2 * k);   // smoothstep
        wash.style.transform = `translateY(${(1 - e) * 8}%)`;
        line.style.display = 'none';
      }
    } else {
      // 转场结束：切换主题，撤掉色层
      st.classList.toggle('dark', DARK(cur.theme));
      st.classList.toggle('red', cur.theme === 'red');
      wash.style.opacity = 0;
      wash.style.transform = 'none';
      line.style.display = 'none';
    }
  }

  // 章节 / 时间码 / 进度
  const C = cur.chap || { num: cur.sid, cn: '', en: '' };
  el('chapNum').textContent = C.num || cur.sid;
  el('chapCn').textContent = C.cn || '';
  el('chapEn').textContent = C.en || '';

  const total = KIT.total || 1;
  el('tcVal').textContent =
    `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  el('progFill').style.width = (CL(t/total) * 100).toFixed(2) + '%';

  // 页码：当前场景序号 / 总数
  el('folioN').textContent = String(cur.sid).padStart(2, '0');
  el('folioT').textContent = '/ ' + String(SCENES.length).padStart(2, '0');

  // 场景自己的动效
  cur.update(t);

  renderCaption(t, cur);
};

// ─── 初始化 ───
window.initScene = function () {
  KIT = window.__KIT__;
  DEF = window.__DEF__ || [];
  if (!KIT) { console.error('没有 __KIT__'); return false; }
  if (!DEF.length) { console.error('没有 __DEF__（场景定义）'); return false; }

  L = Layout.fromURL();

  // 画布尺寸
  const st = el('stage');
  st.style.width = L.W + 'px';
  st.style.height = L.H + 'px';
  document.documentElement.style.width = L.W + 'px';
  document.documentElement.style.height = L.H + 'px';
  document.body.style.width = L.W + 'px';
  document.body.style.height = L.H + 'px';

  // 角标 / 时间码位置
  const O = L.pad('outer');
  el('chap').style.left = O + 'px';
  el('chap').style.top = O + 'px';
  el('chapNum').style.fontSize = L.font('h1') * 0.46 + 'px';
  el('chapCn').style.fontSize = L.font('label') * 0.68 + 'px';
  el('chapEn').style.fontSize = L.font('micro') + 'px';

  el('tc').style.right = O + 'px';
  el('tc').style.top = O + 'px';
  el('tcVal').style.fontSize = L.font('label') * 0.6 + 'px';
  el('tcLbl').style.fontSize = L.font('micro') * 0.8 + 'px';

  // ═══ 印刷品结构：页眉栏线 + 页脚栏线 + 页码 ═══
  // 栏线横贯内容区（左边缘到右边缘），1px，低对比
  const cw = L.W - O * 2;
  const hrY = Math.round(O + L.font('h1') * 0.46 + L.pad('gap') * 0.85);
  el('hr').style.left = O + 'px';
  el('hr').style.width = cw + 'px';
  el('hr').style.top = hrY + 'px';

  const frY = L.H - Math.round(O * 1.70);
  el('fr').style.left = O + 'px';
  el('fr').style.width = cw + 'px';
  el('fr').style.top = frY + 'px';

  // 页码：右对齐到内容区右边缘，坐在页脚栏线上方
  el('folio').style.right = O + 'px';
  el('folio').style.top = (frY - L.font('micro') * 2.0) + 'px';
  el('folio').style.fontSize = L.font('micro') * 0.92 + 'px';

  // 进度条
  el('prog').style.left = O + 'px';
  el('prog').style.right = O + 'px';
  el('prog').style.bottom = Math.round(O * 0.8) + 'px';
  el('prog').style.height = Math.max(2, Math.round(L.H / 640)) + 'px';

  // 纸纹尺寸
  el('grain').width = Math.round(L.W / 4);
  el('grain').height = Math.round(L.H / 4);

  buildScenes();

  console.log(`场景 ${SCENES.length} 个  ${L.ratio} ${L.W}x${L.H}`);
  return SCENES.length > 0;
};
</script>
</body>
</html>
